[package]
name = "cleandl"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A small client that applies CleanDL sorting rules to downloaded files"
repository = "https://github.com/chevybeef/cleandl"
homepage = "https://github.com/chevybeef/cleandl"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
filetime = "0.2"
log = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
simplelog = "0.12"
dirs-next = "2"
semver = "1"
self-replace = "1.5"
flate2 = "1"
tar = "0.4"
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
indicatif = "0.18.6"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[build-dependencies]
vergen-gitcl = "9"

# NoBoilerPlate Suggested along with clippy.toml for test overrides
[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
too_many_lines = "allow"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = '...'
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
